services:
  # Service Web (Site)
  - type: web
    name: verification-site
    runtime: python
    repo: https://github.com/klf249/discord-verification-bot
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: cd web && gunicorn app:app
    envVars:
      - key: BOT_API_URL
        fromService:
          name: verification-bot
          type: web
          property: host
      - key: SITE_URL
        value: https://verification-site.onrender.com
      - key: SECRET_KEY
        generateValue: true
      - key: BOT_TOKEN
        sync: false
      - key: GUILD_ID
        value: 1473260729166467186
      - key: ROLE_ID
        value: 1473260729166467186
      - key: VERIFY_CHANNEL_ID
        sync: false
      - key: STAFF_CHANNEL_ID
        sync: false

  # Service Bot
  - type: web
    name: verification-bot
    runtime: python
    repo: https://github.com/klf249/discord-verification-bot
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: cd bot && python main.py
    envVars:
      - key: BOT_API_URL
        value: https://verification-bot.onrender.com
      - key: SITE_URL
        value: https://verification-site.onrender.com
      - key: BOT_TOKEN
        sync: false
      - key: GUILD_ID
        value: 1473260729166467186
      - key: ROLE_ID
        value: 1473260729166467186
      - key: VERIFY_CHANNEL_ID
        sync: false
      - key: STAFF_CHANNEL_ID
        sync: false
