services:
  # Service Web (Site)
  - type: web
    name: verification-site
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: cd web && gunicorn app:app
    envVars:
      - key: BOT_API_URL
        value: https://verification-bot.onrender.com
      - key: SITE_URL
        value: https://verification-site.onrender.com
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: verification-db
          property: connectionString
      - key: BOT_TOKEN
        sync: false
      - key: GUILD_ID
        value: 1473260729166467186
      - key: ROLE_ID
        value: 1473260729166467186
      - key: VERIFY_CHANNEL_ID
        sync: false
      - key: STAFF_CHANNEL_ID
        sync: false

  # Service Worker (Bot) - on le met aussi en web service pour avoir une URL
  - type: web
    name: verification-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: cd bot && python main.py
    envVars:
      - key: BOT_API_URL
        value: https://verification-bot.onrender.com
      - key: SITE_URL
        value: https://verification-site.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: verification-db
          property: connectionString
      - key: BOT_TOKEN
        sync: false
      - key: GUILD_ID
        value: 1473260729166467186
      - key: ROLE_ID
        value: 1473260729166467186
      - key: VERIFY_CHANNEL_ID
        sync: false
      - key: STAFF_CHANNEL_ID
        sync: false

  # Base de données PostgreSQL
  - type: database
    name: verification-db
    databaseName: verification
    plan: free
